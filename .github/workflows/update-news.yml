name: Atualizar notícias (de hora em hora)

on:
  schedule:
    # De hora em hora, das 06:00 às 20:00 de Brasília (09-23 UTC), seg-sáb.
    # Para rodar 24/7 troque por: - cron: "0 * * * *"
    - cron: "0 9-23 * * 1-6"
  workflow_dispatch: {}    # permite rodar manualmente na aba Actions

permissions:
  contents: write

concurrency:
  group: atualiza-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias por setor
        run: python scripts/update_news.py

      - name: Commit e push se houver mudanças
        id: commit
        run: |
          git config user.name "painel-bot"
          git config user.email "actions@github.com"
          git add data/news.js
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: notícias $(date -u '+%F %H:%M')"
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            git pull --rebase -X theirs && git push
          fi

      - name: Publicar no Azure (commits de robô não disparam o deploy sozinhos)
        if: steps.commit.outputs.mudou == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MUD_0822B2C10 }}
          action: upload
          app_location: "/"
          output_location: ""
          skip_app_build: true
