name: Atualizar Instagram (de hora em hora)

on:
  schedule:
    # 30 min após a hora cheia, das 06:30 às 20:30 de Brasília, seg-sáb.
    - cron: "30 9-23 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualiza-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se os secrets do Instagram estão configurados
        id: cfg
        env:
          T: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets IG_TOKEN/IG_USER_ID ainda não configurados — pulando (veja GUIA-PUBLICACAO.md, etapa 5)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Buscar métricas do Instagram
        if: steps.cfg.outputs.ok == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_ID2: ${{ secrets.IG_USER_ID2 }}
          IG_TOKEN2: ${{ secrets.IG_TOKEN2 }}
        run: python scripts/update_instagram.py

      - name: Commit e push se houver mudanças
        id: commit
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git config user.name "painel-bot"
          git config user.email "actions@github.com"
          git add data/instagram.js
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: instagram $(date -u '+%F %H:%M')"
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            git pull --rebase -X theirs && git push
          fi

      - name: Publicar no Azure (commits de robô não disparam o deploy sozinhos)
        if: steps.commit.outputs.mudou == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_MUD_0822B2C10 }}
          action: upload
          app_location: "/"
          output_location: ""
          skip_app_build: true
