name: Sincronizar funil com a planilha (de hora em hora)

on:
  schedule:
    # 15 min após o robô de notícias, das 06:15 às 20:15 de Brasília, seg-sáb.
    # Para rodar 24/7 troque por: - cron: "15 * * * *"
    - cron: "15 9-23 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualiza-dados
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se os secrets do SharePoint estão configurados
        id: cfg
        env:
          T: ${{ secrets.GRAPH_TENANT_ID }}
        run: |
          if [ -z "$T" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets do Microsoft Graph ainda não configurados — pulando (veja GUIA-PUBLICACAO.md, etapa 4)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependência
        if: steps.cfg.outputs.ok == 'true'
        run: pip install openpyxl

      - name: Baixar planilha do SharePoint/OneDrive
        if: steps.cfg.outputs.ok == 'true'
        env:
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          SP_SITE: ${{ secrets.SP_SITE }}
          SP_USER_UPN: ${{ secrets.SP_USER_UPN }}
          SP_FILE_PATH: ${{ secrets.SP_FILE_PATH }}
        run: python scripts/sync_sharepoint.py planilha.xlsm

      - name: Extrair funil e indicadores
        if: steps.cfg.outputs.ok == 'true'
        run: python scripts/extract_funil.py planilha.xlsm

      - name: Commit e push se houver mudanças
        if: steps.cfg.outputs.ok == 'true'
        run: |
          rm -f planilha.xlsm
          git config user.name "painel-bot"
          git config user.email "actions@github.com"
          git add data/funil.js
          git diff --cached --quiet || git commit -m "chore: funil $(date -u '+%F %H:%M')"
          git pull --rebase && git push
